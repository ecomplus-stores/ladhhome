<section
  class="product"
  :data-product-id="body._id"
  :data-sku="body.sku"
  :data-selected-variation="selectedVariationId"
>
  <a-alert
    :can-show="hasLoadError"
    variant="danger"
  >
    {{ i19loadProductErrorMsg }}
    <a
      href="#"
      class="alert-link"
      @click.prevent="fetchProduct"
    >
      {{ i19retry }}
    </a>
  </a-alert>

  <transition enter-active-class="animated fadeIn slower">
    <div
      v-if="body._id"
      class="row"
    >
      <slot name="gallery-col">
        <div :class="galleryColClassName">
          <component
            :is="isSSR ? 'portal' : 'div'"
            selector="#product-gallery"
          > 
            <slot name="stamps"/>
            <product-gallery
              :product="body"
              :can-add-to-cart="canAddToCart && body.available && isInStock"
              :current-slide.sync="currentGalleyImg"
              :is-s-s-r="isSSR"
            >
              <slot name="first-picture"/>
            </product-gallery>
            <slot name="gallery-footer"/>
          </component>
        </div>
      </slot>

      <div
        class="col"
        ref="actions"
      >
        <slot
          v-if="!isSSR"
          name="heading"
        >
          <component
            :is="headingTag"
            class="product__name"
          >
            {{ name }}
          </component>
          <p class="product__sku">
            COD: {{ body.sku }}
          </p>
        </slot>

        <component
          :is="isSSR ? 'portal' : 'div'"
          selector="#product-actions"
        >
          <slot name="rating">
            <div
              v-once
              class="product__rating"
              :data-sku="body.sku"
            ></div>
          </slot>

          <div
            v-if="!body.available"
            class="product__unavailable"
          >
            <slot name="unavailable">
              {{ i19unavailable }}
            </slot>
          </div>

          <div
            v-else-if="!isInStock"
            class="product__out-of-stock"
          >
            <slot name="out-of-stock">
              {{ i19outOfStock }}
            </slot>
          </div>

          <div
            v-else-if="isWithoutPrice"
            class="product__without-price"
          >
            <slot name="without-price">
              <a 
                v-if="quoteLink"
                target="_blank"
                rel="noopener"
                :href="quoteLink"
              >
                {{ i19quoteProduct }}
              </a>
            </slot>
          </div>

          <template v-else>
            <slot name="prices">
              <div class="product__prices lh-pp">
                <div class="lh-pp__tags">
                  <slot
                    name="discount-tag"
                    v-bind="{ discount }"
                  >
                    <span v-if="discount > 0" class="lh-card__off">{{ discount }}% OFF</span>
                  </slot>
                  <span v-if="isLowQuantity" class="lh-pp__stock">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/></svg>
                    {{ productQuantity === 1 ? 'Última unidade' : `Últimas ${productQuantity} unidades` }}
                  </span>
                </div>
                <lh-product-prices
                  :product="ghostProductForPrices"
                  @fix-price="price => fixedPrice = price"
                />
              </div>

              <div v-if="!isQuickview" class="lh-deliv">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 17h-2v-4m-1 -8h11v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5"/><path d="M3 9l4 0"/></svg>
                <div>
                  <b>{{ lhDelivery.title }}</b>
                  <span>
                    Comprando nas próximas <em>{{ lhCountdown }}</em> ·
                    <a href="/pages/entregas-no-mesmo-dia">ver regiões</a>
                  </span>
                </div>
              </div>
            </slot>

            <slot
              name="variations"
              v-if="hasVariations"
            >
              <product-variations
                :product="body"
                :selected-id.sync="selectedVariationId"
                :max-options-btns="maxVariationOptionsBtns"
                @select-option="handleGridOption"
              />
              <a-alert :can-show="hasClickedBuy && !selectedVariationId">
                {{ i19selectVariationMsg }}
              </a-alert>

              <slot name="variations-info"/>
            </slot>

            <slot
              name="customizations"
              v-if="body.customizations"
            >
              <div
                v-for="custom in body.customizations"
                v-if="custom.custom_value"
                :key="custom._id"
                class="product__customization form-group"
                :class="custom.grid_id ? `product__customization--${custom.grid_id}` : null"
              >
                <label :for="`c-${custom._id}`">
                  {{ custom.label }}
                  <span
                    v-if="custom.add_to_price"
                    class="badge badge-secondary"
                  >
                    {{ formatAdditionalPrice(custom.add_to_price) }}
                  </span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  :id="`c-${custom._id}`"
                  @keyup="ev => setCustomizationOption(custom, ev.target.value)"
                >
              </div>
            </slot>

            <div
              v-if="isKit"
              class="product__kit"
            >
              <slot
                name="kit"
                v-bind="{ kitItems }"
              >
                <transition enter-active-class="animated fadeInUp">
                  <quantity-selector
                    v-if="kitItems.length && !isKitWithVariations"
                    :items="kitItems"
                    :min="body.min_quantity"
                    :max="body.quantity"
                    :slug="body.slug"
                    :kit-product-id="body._id"
                    :kit-name="name"
                    :kit-price="fixedPrice"
                    @buy="d => $emit('buy', d)"
                  >
                    <template #buy-button-content>
                      <slot name="buy-button-content"/>
                    </template>
                  </quantity-selector>
                  <kit-product-variations
                    v-if="kitItems.length && isKitWithVariations"
                    :items="kitItems"
                    :min="body.min_quantity"
                    :max="body.quantity"
                    :slug="body.slug"
                    :kit-product-id="body._id"
                    :kit-name="name"
                    :kit-price="fixedPrice"
                    :max-options-btns="maxVariationOptionsBtns"
                  >
                    <template #buy-button-content>
                      <slot name="buy-button-content"/>
                    </template>
                  </kit-product-variations>
                </transition>

                <span
                  v-if="!kitItems.length"
                  class="product__kit-loading spinner-border"
                  role="status"
                >
                  <span class="sr-only">Loading...</span>
                </span>
              </slot>
            </div>

            <template v-else>
              <div
                v-if="!isVariationInStock"
                class="product__out-of-stock"
              >
                <slot name="out-of-stock">
                  {{ i19outOfStock }}
                </slot>
              </div>

              <div
                v-else-if="hasBuyButton"
                class="product__buy"
                ref="buy"
              >
                <component
                  :is="hasQuantitySelector ? 'quantity-selector' : 'div'"
                  :items="hasQuantitySelector ? [{ _id: body._id, quantity: body.min_quantity || 1 }] : null"
                  :min="body.min_quantity"
                  :max="body.quantity"
                  :has-buy-button="false"
                  @set-quantity="({ quantity }) => qntToBuy = quantity"
                >
                  <span @click="buy">
                    <slot
                      name="buy"
                      v-bind="{ hasClickedBuy, isOnCart }"
                    >
                      <button
                        type="button"
                        class="btn btn-lg btn-primary"
                        :disabled="hasClickedBuy && !isOnCart"
                      >
                        <slot name="buy-button-content">
                          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M5.001 8h13.999a2 2 0 0 1 1.977 2.304l-1.255 7.152a3 3 0 0 1 -2.966 2.544h-9.512a3 3 0 0 1 -2.965 -2.544l-1.255 -7.152a2 2 0 0 1 1.977 -2.304z"/><path d="M17 10l-2 -6"/><path d="M7 10l2 -6"/></svg>
                          {{ strBuy }}
                        </slot>
                      </button>
                    </slot>
                  </span>
                </component>
              </div>

            </template>

            <template v-if="!isQuickview">
              <!-- frete e pagamento em abas, logo abaixo do botão Comprar -->
              <section class="lh-sp">
                <div class="lh-sp__tabs" role="tablist">
                  <button
                    v-if="!isKit || kitItems.length"
                    type="button"
                    role="tab"
                    class="lh-sp__tab"
                    :class="{ 'is-on': lhTab === 'ship' }"
                    :aria-selected="lhTab === 'ship' ? 'true' : 'false'"
                    @click="lhTab = 'ship'"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 17h-2v-4m-1 -8h11v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5"/><path d="M3 9l4 0"/></svg>
                    Frete e prazo
                  </button>
                  <button
                    v-if="paymentOptions.length"
                    type="button"
                    role="tab"
                    class="lh-sp__tab"
                    :class="{ 'is-on': lhTab === 'pay' || (isKit && !kitItems.length) }"
                    :aria-selected="lhTab === 'pay' ? 'true' : 'false'"
                    @click="lhTab = 'pay'"
                  >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/><path d="M3 10l18 0"/><path d="M7 15l.01 0"/><path d="M11 15l2 0"/></svg>
                    Pagamento
                  </button>
                </div>

                <div
                  v-if="!isKit || kitItems.length"
                  v-show="lhTab === 'ship'"
                  class="lh-sp__panel"
                  role="tabpanel"
                >
                  <slot name="shipping">
                    <shipping-calculator
                      :shippedItems="isKit ? kitItems : [{
                        ...body,
                        ...selectedVariation,
                        product_id: body._id,
                        quantity: qntToBuy || body.min_quantity || 1
                      }]"
                    >
                      <template v-slot:free-from-value="{ amountSubtotal, freeFromValue }">
                        <div class="product__free-shipping-from">
                          {{ i19freeShippingFrom }}
                          <strong>
                            {{ Math.ceil(freeFromValue / amountSubtotal) }}
                            {{ i19units }}
                          </strong>
                        </div>
                      </template>
                    </shipping-calculator>
                  </slot>
                </div>

                <div
                  v-if="paymentOptions.length"
                  v-show="lhTab === 'pay' || (isKit && !kitItems.length)"
                  class="lh-sp__panel lh-sp__pay"
                  role="tabpanel"
                >
                  <slot name="payment-gateways" v-bind="{ paymentOptions }">
                    <div
                      v-for="paymentOption in lhPaymentOptions"
                      :key="paymentOption.app_id"
                      :id="`product-payment-${paymentOption.app_id}`"
                      class="lh-sp__gateway"
                    >
                      <slot :name="`payment-${paymentOption.app_id}`">
                        <lh-payment-option
                          v-for="(gateway, i) in paymentOption.payment_gateways"
                          :key="`${paymentOption.app_id}-${i}`"
                          :payment-gateway="gateway"
                          :installments-option="paymentOption.installments_option"
                          :price="fixedPrice"
                        />
                      </slot>
                    </div>
                  </slot>
                </div>
              </section>

              <a
                v-if="lhWhatsappUrl"
                class="lh-wa"
                :href="lhWhatsappUrl"
                target="_blank"
                rel="noopener"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9"/><path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1"/></svg>
                Tirar dúvida pelo WhatsApp
              </a>

              <ul class="lh-trust">
                <li>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"/><path d="M9 12l2 2l4 -4"/></svg>
                  <span><b>Compra segura</b>Pagamento protegido</span>
                </li>
                <li>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
                  <span><b>Troca em 7 dias</b>Devolução grátis</span>
                </li>
                <li>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 17h-2v-4m-1 -8h11v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5"/><path d="M3 9l4 0"/></svg>
                  <span><b>Entrega rápida</b>No mesmo dia em SP</span>
                </li>
              </ul>
            </template>

            <slot name="sale-timer">
              <div
                v-if="isOnSale"
                class="product__sale-timer mb-3"
              >
                <div>
                  {{ i19offer }}
                  <br><small>{{ i19endsIn }}</small>
                </div>
                <div
                  class="h1 ml-3 mb-0"
                  ref="timer"
                >
                  00:00:00
                </div>
              </div>
            </slot>

            <p
              v-if="body.production_time && body.production_time.days"
              class="product__production"
            >
              <i class="i-info-circle mr-1"></i>
              {{ i19productionDeadline }}:
              <strong>
                {{ body.production_time.days }}
                {{ body.production_time.working_days ? i19workingDays : i19days }}
                <template v-if="body.production_time.cumulative">
                  {{ i19perUnit }}
                </template>
              </strong>
            </p>

            <!-- ações discretas: favoritar e compartilhar -->
            <div class="lh-acts">
              <slot name="favorite">
                <div>
                  <a
                    class="btn btn-sm product__favorite"
                    @click="toggleFavorite"
                    :href="isLogged ? null : accountUrl"
                  >
                    <i 
                      class="i-heart mr-1"
                      :class="isFavorite ? 'active' : null"
                    >
                    </i>
                    <span>
                      {{ isFavorite ? i19removeFromFavorites : i19addToFavorites }}
                    </span>
                  </a>
                </div>
              </slot>
  
              <slot name="share">
                <a-share
                  v-if="body.slug"
                  class="mb-3"
                  :url="`/${body.slug}`"
                  :title="body.name"
                  :description="body.short_description"
                />
              </slot>
              </div>

            <slot name="track-price">
              <div
                v-once
                class="product__track-price"
                :data-sku="body.sku"
              ></div>
            </slot>
          </template>
        </component>

        <slot
          v-if="!isSSR && body.short_description"
          name="short-description"
        >
          <p class="product__info lead">
            {{ body.short_description }}
          </p>
        </slot>
      </div>
    </div>
  </transition>

  <template v-if="!isQuickview && hasStickyBuyButton && body.available && isInStock">
    <transition
      enter-active-class="animated fadeIn"
      leave-active-class="animated fadeOut fast" 
    >
      <div
        v-show="isStickyBuyVisible"
        ref="sticky" 
        class="product__sticky"
      >
        <div class="product__sticky-container container">
          <div class="product__sticky-info">
            <a-picture
              :can-calc-height="false"
              :src="thumbnail"
              class="product__sticky-picture"
            />
            <h5>{{ name }}</h5>
          </div>

          <div class="product__sticky-buy">
            <a-prices
              :product="ghostProductForPrices"
              :is-literal="false"
              :can-show-price-options="true"
            />
            <a
              class="btn btn-lg btn-primary"
              href="#"
              @click.prevent="buyOrScroll"
            >
              <i class="i-shopping-bag mr-1"></i>
              {{ strBuy }}
            </a>
          </div>
        </div>
      </div>
    </transition>
  </template>

  <slot v-if="!body._id"/>
</section>
